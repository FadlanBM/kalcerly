<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kalcerly - Onboarding</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="mobile-container">
      <!-- Ambient Background Lighting Orbs -->
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <!-- Top Header Bar -->
      <header class="top-bar">
        <div class="brand">
          <div class="logo-icon">
            <svg width="12" height="15" viewBox="0 0 12 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4.5 15L5.625 9.375H0L7.5 0L6.375 5.625H12L4.5 15Z" fill="#0B0E14"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Kalcerly</span>
            <span class="brand-sub">FIT PROTOCOL</span>
          </div>
        </div>
      </header>

      <!-- Footer - Bottom Action Sheet -->
      <main class="bottom-sheet">
        <div class="headline-group">
          <div class="tagline">
            <div class="tagline-icon">
               <svg width="10" height="12" viewBox="0 0 24 24" fill="none" stroke="#CCFF80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.65 14.28c-1.63 1.95-3.65 3.72-6.15 3.72-2.5 0-4.52-1.77-6.15-3.72A10 10 0 0 1 12 2a10 10 0 0 1 6.65 12.28z"></path>
                <path d="M12 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
              </svg>
            </div>
            <span class="tagline-text">MAKE MOVEMENT A CULTURE</span>
          </div>
          
          <h1 class="heading">
            <span class="text-white">Ubah Gerakan Jadi Budaya &amp;</span>
            <span class="text-accent">Hadiah Nyata</span>
          </h1>
          
          <p class="description">
            Lacak aktivitas lari, jalan, dan sepedamu dengan verifikasi AI anti-cheat. Dapatkan token FIT dan buktikan pencapaianmu on-chain.
          </p>
        </div>

        <div class="social-proof">
          <div class="avatars">
            <div class="avatar avatar-1">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#CCFF80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"></circle><path d="m22 20-3-3-4-8-5 5"></path><path d="M22 20h-7.8"></path><path d="m2 20 8-12 1.4 2"></path></svg>
            </div>
            <div class="avatar avatar-2">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7BD0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"></circle><path d="m22 20-3-3-4-8-5 5"></path><path d="M2 20h20"></path></svg>
            </div>
            <div class="avatar avatar-3">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
          </div>
          <div class="social-text">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#FBBF24" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>Bergabung dengan <span class="highlight-text">25,000+</span> atlet aktif</span>
          </div>
        </div>

        <div class="action-group">
          <button class="btn-primary" onclick="window.location.href='register.html'">
            <span>Mulai Sekarang</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
          
          <div class="login-link">
            <span class="login-text">Sudah punya akun?</span>
            <a href="#" class="login-action">Masuk</a>
          </div>
        </div>

        <div class="home-indicator">
          <div class="indicator-line"></div>
        </div>
      </main>
    </div>
  </body>
</html>
